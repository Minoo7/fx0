services:
  init:
    build: .
    command: [node, scripts/init-secrets.mjs]
    volumes:
      - secrets:/secrets
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: fx0
      POSTGRES_DB: fx0
      POSTGRES_PASSWORD_FILE: /secrets/database
    volumes:
      - postgres:/var/lib/postgresql/data
      - secrets:/secrets:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U fx0 -d fx0]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-bookworm
    restart: unless-stopped
    entrypoint: [redis-server, /secrets/redis.conf]
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - redis:/data
      - secrets:/secrets:ro
  app:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - secrets:/secrets:ro
      - app-data:/data
  tailscale:
    image: tailscale/tailscale:v1.102.3
    hostname: fx0
    restart: unless-stopped
    environment:
      TS_HOSTNAME: fx0
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: 'true'
      TS_AUTH_ONCE: 'true'
      TS_SERVE_CONFIG: /secrets/serve.json
      TS_AUTHKEY: ${TS_AUTHKEY:-}
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - tailscale:/var/lib/tailscale
      - secrets:/secrets:ro
  tailnet-proxy:
    build: .
    command: [node, scripts/tailnet-proxy.mjs]
    restart: unless-stopped
    network_mode: service:tailscale
    depends_on: [tailscale, app]
    volumes:
      - secrets:/secrets:ro
volumes:
  postgres:
  redis:
  secrets:
  app-data:
  tailscale:
